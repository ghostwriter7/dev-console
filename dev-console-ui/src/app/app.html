<clr-main-container>
  <app-nav/>

  <div class="content">
    @for (message of messages(); track message) {
      @switch (message.type) {
        @case ('input') {
          <app-script-control
            [availableServices]="availableServices()"
            [payload]="message.payload"
            (payloadChange)="onPayloadChange(message.uuid, $event)"
            (activeService)="onActiveServiceChange($event)"
          />
        }
        @case ('output') {
          <app-output-renderer [payload]="message.payload" />
        }
        @case ('error') {
          <app-error-message [error]="message.payload.error" [stackTrace]="message.payload.stackTrace"/>
        }
      }

      @if (!$last) {
        <hr/>
      }
    }
  </div>

</clr-main-container>
