<clr-main-container>
  <app-nav/>

  <main>

    @if (hasNoAvailableServices()) {
      <clr-alert [clrAlertType]="'warning'" [clrAlertClosable]="false">
        <clr-alert-item>
          <span class="alert-text">There are no connected services.</span>
        </clr-alert-item>
      </clr-alert>
    } @else {
      <app-message-group-list />
      <app-add-cell-button />
    }
  </main>

</clr-main-container>
