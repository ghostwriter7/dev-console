plugins {
    id 'org.springframework.boot'
    id 'java-library'
    id 'maven-publish'
}

//def uiDir = file("$rootDir/dev-console-ui")
//def uiDistDir = file("$uiDir/dist/dev-console/browser")
//def generatedUiStaticDir = file("$buildDir/generated-resources/main/static/dev-console")
//def npmCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

dependencies {
    api platform('org.springframework.boot:spring-boot-dependencies:3.4.0')

    api 'org.springframework.boot:spring-boot-autoconfigure'
    api 'org.springframework.boot:spring-boot-starter-websocket'

    implementation project(':dev-console-common')
    implementation 'org.apache.groovy:groovy-all:5.0.5'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}

